services:
  nfetcher:
    image: local/nfetcher:latest
    container_name: nfetcher
    restart: unless-stopped
    user: 1000:1000
    environment:
      TZ: Asia/Shanghai
      RUN_MODE: daemon
      SCHEDULE_CRON: 30 17 * * *
      LIBRARY_DIR: /library/nhentai-popular
      RETENTION_DAYS: 7
      SEARCH_QUERY: language:chinese
      SEARCH_SORT: popular-today
      SEARCH_PAGE: 1
      GALLERY_CONCURRENCY: 5
      DETAIL_CONCURRENCY: 5
      PAGE_CONCURRENCY: 6
      REQUEST_RPS: 8
      REQUEST_BURST: 16
      HTTP_TIMEOUT: 30s
      RETRY_MAX: 3
      HTTP_PROXY: http://host.docker.internal:17890
      HTTPS_PROXY: http://host.docker.internal:17890
      NO_PROXY: ""
      BARK_BASE_URL: ""
      BARK_DEVICE_KEY: ""
      BARK_SOUND: paymentsuccess
    volumes:
      - ./library/nhentai:/library/nhentai-popular
    extra_hosts:
      - host.docker.internal:host-gateway
